name: Build and release

# Push a tag like v0.1.0 to build all three platforms and attach them to a
# GitHub release. Also runnable by hand from the Actions tab, either to
# rebuild a tag that exists or to cut a new one from the branch you run it on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0). An existing tag is rebuilt from itself; a new one is created on the branch you run this from"
        required: true

permissions:
  contents: write

jobs:
  # Which commit a hand-started run builds was nobody's decision: checkout took
  # the branch the run began on, while the release took its name from the tag
  # typed in. Nothing tied the two together, so binaries could go out under a
  # name that wasn't theirs. Decide it once here, and let the build follow.
  ref:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Work out what to build
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
          TRIGGER: ${{ github.ref }}
        run: |
          # A tag push builds its own tag. A hand-started run builds the tag it
          # names when that tag is already there, so a rebuild can't quietly
          # pick up whatever the branch has moved on to. A tag that doesn't
          # exist yet has nothing to check out, so the branch the run began on
          # is built and the release step creates the tag against it.
          REF="$TRIGGER"
          if [ -n "$TAG" ] && gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            REF="refs/tags/$TAG"
          fi
          echo "build=$REF" >> "$GITHUB_OUTPUT"
          echo "Building $REF"

  build:
    needs: ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS-universal2
            args: "--universal2"
          - os: windows-latest
            name: windows-x86_64
            args: ""
          - os: ubuntu-22.04
            name: linux-x86_64
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ref.outputs.build }}

      - name: Check the version matches the tag
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # The release is named after the tag, but the app reports the version
          # built into it, and the updater compares one against the other. Let
          # the two drift apart and every copy out there is told an update is
          # waiting that it already has, for good. Checked on each runner, so
          # what it clears is the tree that binary is actually built from.
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' sortero/version.py)
          echo "tag $TAG, sortero/version.py says ${VERSION:-(unreadable)}"
          if [ -z "$VERSION" ]; then
            echo "::error::Couldn't read __version__ out of sortero/version.py," \
                 "so there is nothing to check $TAG against."
            exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::$TAG would ship a build that calls itself v$VERSION." \
                 "Bump sortero/version.py to match the tag, or tag v$VERSION."
            exit 1
          fi

      # setup-python ships the python.org macOS build, which is universal2 -
      # that is what makes the universal Mac app possible.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Create venv and install deps
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          $PY -m pip install -q --upgrade pip
          $PY -m pip install -q mutagen keyring certifi pygame-ce pyinstaller

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          $PY build/build_app.py ${{ matrix.args }}

      - name: Verify macOS binary is universal
        if: runner.os == 'macOS'
        run: |
          BIN=build/dist/Sortero/Sortero.app/Contents/MacOS/Sortero
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -q x86_64 && lipo -archs "$BIN" | grep -q arm64 \
            || { echo "not universal"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Sortero-${{ matrix.name }}
          path: build/dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check the builds token is set
        env:
          BUILDS_TOKEN: ${{ secrets.BUILDS_TOKEN }}
        run: |
          if [ -z "$BUILDS_TOKEN" ]; then
            echo "::error::Add a BUILDS_TOKEN secret so the builds can go to the private builds repository. See server/README.md."
            exit 1
          fi

      # The ready-to-run app is a thank-you for supporters, so the builds go to a
      # private repository, and the licence server hands them to licence holders.
      - name: Publish builds privately
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.BUILDS_REPO || 'sparkly-quasar/sortero-builds' }}
          token: ${{ secrets.BUILDS_TOKEN }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Sortero ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/**/*.zip
          fail_on_unmatched_files: true
          body: Sortero ${{ github.event.inputs.tag || github.ref_name }}

      - name: Publish release notes publicly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Sortero ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Sortero is free and open source: build it yourself by following
            [Building from source](https://github.com/sparkly-quasar/sortero#building-from-source).

            If Sortero has been useful to you, please consider buying a
            Supporter licence: open *Support Sortero* in the app. You choose
            what to pay, once. Sortero is an independent project, built and
            released at its author's own expense with the help of Claude Code,
            and supporters are what keep it improving.

            As a thank-you, supporters get the ready-to-run app for macOS,
            Windows and Linux, with one-click updates.

            ---
